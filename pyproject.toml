[project]
name = "mycode-localization"
version = "0.1.0"
description = "Evidence-aware dynamic localization prototype"
requires-python = ">=3.9"
dependencies = [
  "pillow==12.3.0",
  "requests==2.34.2",
]

[project.optional-dependencies]
browser = [
  "playwright==1.62.0",
]
dev = [
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
